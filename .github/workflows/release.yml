name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            tag: darwin-arm64
            pyarch: arm64
          - os: macos-14          # arm64 runner 经 Rosetta 跑 x64 Python 出 x86_64 包
            tag: darwin-x86_64
            pyarch: x64
          - os: ubuntu-22.04
            tag: linux-x86_64
            pyarch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: ${{ matrix.pyarch }}
      - name: Build onedir
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          pyinstaller --clean --noconfirm \
            --name compile-excel-server --onedir \
            --collect-all uvicorn --collect-all fastapi \
            ces_main.py
      - name: Package
        run: |
          tar -czf "compile-excel-server-${{ matrix.tag }}.tar.gz" \
            -C dist compile-excel-server
      - uses: softprops/action-gh-release@v2
        with:
          files: compile-excel-server-*.tar.gz
