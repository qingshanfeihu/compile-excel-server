name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            tag: darwin-arm64
            pyarch: arm64
          - os: macos-14          # arm64 runner 经 Rosetta 跑 x64 Python 出 x86_64 包
            tag: darwin-x86_64
            pyarch: x64
          - os: ubuntu-22.04
            tag: linux-x86_64
            pyarch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: ${{ matrix.pyarch }}
      - name: Build onedir
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          pyinstaller --clean --noconfirm \
            --name compile-excel-server --onedir \
            --collect-all uvicorn --collect-all fastapi \
            ces_main.py
      - name: Check out compile-excel-skills (gateway criteria source; linux only)
        if: startsWith(matrix.tag, 'linux')
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/compile-excel-skills
          token: ${{ secrets.CEX_SKILLS_READ_TOKEN }}
          path: compile-excel-skills
      - name: Build gateway (cexg, jumphost; linux only)
        if: startsWith(matrix.tag, 'linux')
        run: |
          python -m pip install openpyxl
          python tools/sync_gateway_vendor.py --only cex_core --skills-root compile-excel-skills
          pyinstaller --clean --noconfirm \
            --name cexg --onedir \
            --collect-submodules gateway \
            --add-data "gateway/agent/jumphost_agent.py:gateway/agent" \
            --add-data "gateway/gateway.example.toml:gateway" \
            gateway/cexg.py
          tar -czf "cexg-${{ matrix.tag }}.tar.gz" -C dist cexg
      - name: Package
        run: |
          tar -czf "compile-excel-server-${{ matrix.tag }}.tar.gz" \
            -C dist compile-excel-server
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.tag }}
          path: |
            compile-excel-server-*.tar.gz
            cexg-*.tar.gz
          if-no-files-found: error

  # 所有平台的包到齐后统一算 SHA256SUMS 并发布：下载方用 sha256sum -c SHA256SUMS 核对
  release:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: SHA256SUMS
        run: |
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
