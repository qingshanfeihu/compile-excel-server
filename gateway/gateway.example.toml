# cexg 网关配置样例。复制成 gateway.toml 后按跳板机实际情况填写；路径一律写绝对路径。
# 网关不读任何 environment 文件，跳板机本机的路径都写在这里。
#
# 网关只有一个调用方：circle-hub 的 worker。它拿一把静态密钥来调用，网关本地比对密钥的 SHA-256，
# 不回调任何服务端。要准备的三样东西：
#   1. 密钥：`openssl rand -hex 32`。明文登记到 hub 的执行资源（凭据模式 static-secret）；跳板机上只放
#      它的 SHA-256，一行 64 位十六进制，权限 600：
#        printf '%s' '<明文>' | sha256sum | cut -d' ' -f1 > ~/.config/cexg/hub.secret.sha256
#      换密钥就是换这个文件的内容，不用重启网关。
#   2. 网关证书：由实验室 CA 签发（gateway.crt / gateway.key）；hub 的执行 profile 里信任那张 CA。
#   3. 规则文件：hub 的规则资产（domain_grammar.json）放到 hub.grammar_file；不配就用状态目录里的那份。

[hub]
# 密钥摘要文件（SHA-256 十六进制）；权限必须 600
secret_sha256_file = "/home/test/.config/cexg/hub.secret.sha256"
# 可选：另一把密钥，带 jumphost:admin（init_device 用）；hub 只在设备初始化时拿它调用。留空 = 不开
admin_secret_sha256_file = ""
# 审计里的调用方名字；hub 可带 X-Circle-Hub-Actor 头说明替谁执行，只进审计和租约持有人
subject = "circle-hub"
# 这张床对应的执行构建名（env_prepare 核对设备自述版本与它一致）
build = "SAMPLE_BUILD_LOCAL"
# 自毁规则等文法；留空 = <state.dir>/domain_grammar.json
grammar_file = ""

[listen]
host = "127.0.0.1"
port = 8910
# 监听非回环地址（0.0.0.0）必须配证书：填实验室 CA 签发的 gateway.crt / gateway.key；
# 受信任的实验网暂时没有证书时可设 insecure_lan = true（明文）
tls_cert = ""
tls_key = ""
insecure_lan = false

[framework]
apv_src = "/home/test/apv_src"
py38 = "/home/test/apv_src/.python3.8/bin/python"
# conf 名必填（<apv_src>/conf/<名>），不再按网卡地址推导
conf_name = "bed.conf"
staging_parent = "/home/test/apv_src/smoke_test/sdns"
default_module = "sdns"
run_max_s = 2400

[state]
dir = "/home/test/.local/state/cexg"
lease_ttl_s = 1800

[results]
# 给了口令文件（0600）就直连 MySQL；不给就借框架自己的 lib.mysqldb.Result_DB
mysql_password_file = ""
mysql_user = "root"
mysql_db = "smoke_test"

[device]
console_command = ["cu", "-s", "9600", "-l", "{tty}"]
tty_name = "ttyS{idx}"
max_devices = 3

[init_device]
# 串口重置时逐条下发的命令，每条都要等到配置模式提示符。占位符：{idx} {port1} {port2} {port3}
# （端口名取自框架 conf 的 [comm] ports）。按本实验室的地址规划填写；留空则 init_device 不可用。
commands = [
  # "no page",
  # "clear config all",
  # "ip add {port1} 192.0.2.7{idx} 24",
]
long_commands = { }        # 例：{ "clear config all" = 60 }，单条命令的超时（秒）
step_timeout_s = 5
login_timeout_s = 10

# 本床常驻服务清单（运维维护）：bed_topology 原样带给客户端（services 字段），编写阶段拿它选真实服务器、
# 触发机要连的端口。不配就是空清单。proto 只能是 http/https/tcp/udp/dns；地址按本实验室实际填写。
# [[bed.services]]
# host = "server231"
# ip = "192.0.2.231"
# proto = "http"
# port = 80
# note = "nginx，/ 回 200"
